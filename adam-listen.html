<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Adam is listening</title>
<style>
:root{--bg:#FFFBEB;--surface:#FFFFFF;--ink:#132039;--ink-2:#44546E;--ink-3:#6B7A92;--line:#E8DFC2;--acc:#5B6CF0;--good:#23714A;--warn:#A35F00;--risk:#AE2439;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#141A28;--surface:#1B2336;--ink:#E6ECF5;--ink-2:#ADBACF;--ink-3:#8292AB;--line:#2A3550;--acc:#8E9BFF;--good:#5DCB8B;--warn:#F0B052;--risk:#F27387;color-scheme:dark}}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column;padding:14px 16px;gap:10px}
header{display:flex;align-items:center;gap:12px}
.ear{position:relative;width:44px;height:44px;border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center;flex:none}
.ear svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ear::after{content:"";position:absolute;inset:-6px;border-radius:50%;border:3px solid var(--acc);opacity:0}
body.on .ear{background:var(--acc)}
body.on .ear::after{animation:ring 1.6s ease-out infinite}
body.heard .ear::after{animation-duration:.7s}
@keyframes ring{0%{transform:scale(.85);opacity:.9}100%{transform:scale(1.25);opacity:0}}
h1{font-size:1.05rem;margin:0;line-height:1.2}
#state{margin:2px 0 0;color:var(--ink-2);font-size:.86rem}
#words{flex:1;min-height:64px;margin:0;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;overflow:auto;font-size:1rem;color:var(--ink)}
#words:empty::before{content:"Your words will show here, and in Adam's box.";color:var(--ink-3)}
#words i{color:var(--ink-3);font-style:normal}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
button,select{font:inherit;font-size:.86rem;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:6px 12px;cursor:pointer}
button.primary{background:var(--ink);color:var(--bg);border-color:var(--ink);font-weight:600}
#mode{margin-left:auto;font-size:.78rem;color:var(--ink-3)}
#mode b{color:var(--good)}
#mode.online b{color:var(--warn)}
#note{margin:0;font-size:.8rem;color:var(--ink-2)}
#note.err{color:var(--risk)}
[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){body.on .ear::after{animation:none;opacity:.6}}
</style>
</head>
<body>
<header>
  <div class="ear" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10v1a7 7 0 0 0 14 0v-1"/><path d="M12 18v4"/></svg></div>
  <div><h1 id="title">Adam's ears</h1><p id="state" aria-live="polite">Getting ready…</p></div>
</header>
<p id="words" aria-live="polite"></p>
<div class="row">
  <button type="button" id="pause" class="primary">Pause</button>
  <label for="lang" style="position:absolute;left:-999px">Language</label>
  <select id="lang" title="Which language you speak">
    <option value="en-US">English (US)</option>
    <option value="en-GB">English (UK)</option>
    <option value="ar-IQ">العربية (العراق)</option>
  </select>
  <button type="button" id="dl" hidden title="Download the speech model so your voice never leaves this computer">Keep my voice on this computer</button>
  <span id="mode"></span>
</div>
<p id="note">Leave this small window open. Adam sends your words two seconds after you stop, and stops listening while he talks.</p>
<script>
(() => {
  'use strict';
  /* Only Hayder's PhD hub may receive what is said here. */
  const HUB = 'https://f95c5575-c672-42dd-9d1b-0e151a7067dc.frame.claudeusercontent.com';
  const $ = id => document.getElementById(id);
  const stateEl = $('state'), words = $('words'), note = $('note'), modeEl = $('mode'), pauseBtn = $('pause'), langSel = $('lang'), dlBtn = $('dl');
  const store = { get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch (e) { /* ignore */ } } };

  const opener = window.opener;
  const asked = new URLSearchParams(location.hash.slice(1)).get('o');
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;

  const S = { want: false, running: false, n: 0, finalText: '', local: false, restarts: [], rec: null, heardT: 0 };

  function setState(t) { stateEl.textContent = t; }
  function setNote(t, err) { note.textContent = t; note.classList.toggle('err', !!err); }
  function tell(type, extra) { if (opener && !opener.closed) { try { opener.postMessage(Object.assign({ adam: 'listen', v: 1, type, n: S.n }, extra || {}), HUB); } catch (e) { /* ignore */ } } }

  if (!opener || asked !== HUB) {
    setState('Not connected');
    setNote('This window only works when Adam opens it from the PhD hub. Close it and click the microphone in Adam’s chat.', true);
    pauseBtn.hidden = true; langSel.hidden = true;
    return;
  }
  if (!SR) {
    setState('This browser cannot listen');
    setNote('Speech to text is not built into this browser. Open the hub in Chrome, Edge or Safari, or use your computer’s dictation in Adam’s box.', true);
    pauseBtn.hidden = true; langSel.hidden = true;
    tell('error', { code: 'unsupported' });
    return;
  }

  langSel.value = store.get('adam-listen-lang') || 'en-US';

  async function pickMode() {
    S.local = false; dlBtn.hidden = true;
    const lang = langSel.value;
    if (typeof SR.available === 'function') {
      let st = 'unavailable';
      try { st = await SR.available({ langs: [lang], processLocally: true }); } catch (e) { st = 'unavailable'; }
      if (st === 'available') S.local = true;
      else if (st === 'downloadable') dlBtn.hidden = false;
      else if (st === 'downloading') { dlBtn.hidden = false; dlBtn.disabled = true; dlBtn.textContent = 'Downloading the on-device model…'; }
    }
    paintMode();
  }
  function paintMode() {
    modeEl.classList.toggle('online', !S.local);
    modeEl.innerHTML = S.local ? '<b>●</b> On this computer' : '<b>●</b> Online speech service';
    modeEl.title = S.local ? 'Your voice is turned into text on this computer; no audio leaves it.' : 'Your browser sends the audio to its speech service (Google in Chrome, Apple in Safari) to turn it into text.';
  }

  function makeRec() {
    const r = new SR();
    r.lang = langSel.value; r.continuous = true; r.interimResults = true; r.maxAlternatives = 1;
    if (S.local && 'processLocally' in r) { try { r.processLocally = true; } catch (e) { S.local = false; paintMode(); } }
    r.onstart = () => { S.running = true; document.body.classList.add('on'); setState('Listening… speak now'); setNote('Adam sends your words two seconds after you stop. Leave this window open.'); tell('listening'); };
    r.onresult = e => {
      let interim = '';
      for (let i = e.resultIndex; i < e.results.length; i++) {
        const t = e.results[i][0].transcript;
        if (e.results[i].isFinal) S.finalText += (S.finalText && !/\s$/.test(S.finalText) ? ' ' : '') + t.trim();
        else interim += t;
      }
      const text = (S.finalText + (interim ? (S.finalText ? ' ' : '') + interim.trim() : '')).trim();
      words.innerHTML = '';
      words.append(document.createTextNode(S.finalText));
      if (interim) { const i = document.createElement('i'); i.textContent = (S.finalText ? ' ' : '') + interim.trim(); words.append(i); }
      document.body.classList.add('heard'); clearTimeout(S.heardT); S.heardT = setTimeout(() => document.body.classList.remove('heard'), 600);
      if (text) tell('words', { text });
    };
    r.onerror = e => {
      const code = e.error || 'error';
      if (code === 'no-speech' || code === 'aborted') return;
      if (code === 'not-allowed' || code === 'service-not-allowed') {
        S.want = false; paintPaused();
        setState('The microphone is blocked');
        setNote('Click the camera/microphone icon in this window’s address bar, choose Allow, then click Resume.', true);
        tell('error', { code: 'blocked' });
      } else if (code === 'language-not-supported') {
        if (S.local) { S.local = false; paintMode(); }
        else { setNote('This language is not available here. Pick another one.', true); tell('error', { code }); }
      } else if (code === 'network') {
        setNote('No connection to the speech service. Check the internet, or use “Keep my voice on this computer”.', true);
        tell('error', { code });
      } else if (code === 'audio-capture') {
        setNote('No microphone found. Check that one is plugged in and chosen in your Mac’s Sound settings.', true);
        tell('error', { code });
      } else setNote('Listening stopped (' + code + '). Click Resume to try again.', true);
    };
    r.onend = () => {
      S.running = false; document.body.classList.remove('on');
      if (!S.want) return;
      const now = Date.now(); S.restarts = S.restarts.filter(t => now - t < 12000); S.restarts.push(now);
      if (S.restarts.length > 6) { S.want = false; paintPaused(); setState('Paused'); setNote('Listening kept stopping, so I paused. Click Resume to try again.', true); tell('paused'); return; }
      setTimeout(() => { if (S.want && !S.running) start(); }, 250);
    };
    return r;
  }
  function start() {
    if (S.running) return;
    S.rec = makeRec();
    try { S.rec.start(); } catch (e) { /* already starting */ }
  }
  function stop() { if (S.rec) { try { S.rec.abort(); } catch (e) { /* ignore */ } } }
  function paintPaused() { pauseBtn.textContent = S.want ? 'Pause' : 'Resume'; if (!S.want) { document.body.classList.remove('on'); } }

  async function resume(n) {
    if (typeof n === 'number') S.n = n;
    S.want = true; S.finalText = ''; words.textContent = ''; S.restarts = []; paintPaused();
    if (S.running) { stop(); return; } /* onend restarts with a clean slate */
    start();
  }
  function pause(label) {
    S.want = false; paintPaused(); stop();
    setState(label || 'Paused');
  }

  pauseBtn.addEventListener('click', () => {
    if (S.want) { pause('Paused'); tell('paused'); }
    else { resume(); tell('resumed'); }
  });
  langSel.addEventListener('change', async () => { store.set('adam-listen-lang', langSel.value); await pickMode(); if (S.want) { stop(); } });
  dlBtn.addEventListener('click', async () => {
    dlBtn.disabled = true; dlBtn.textContent = 'Downloading… (one time)';
    let ok = false;
    try { ok = await SR.install({ langs: [langSel.value], processLocally: true }); } catch (e) { ok = false; }
    dlBtn.disabled = false; dlBtn.textContent = 'Keep my voice on this computer';
    if (ok) { await pickMode(); setNote('Done. From now on your voice stays on this computer.'); if (S.want) stop(); }
    else setNote('The download did not work this time. Listening still works with the online service.', true);
  });

  window.addEventListener('message', e => {
    if (e.origin !== HUB || e.source !== opener) return;
    const d = e.data; if (!d || d.adam !== 'listen') return;
    if (d.cmd === 'resume') resume(d.n);
    else if (d.cmd === 'pause') pause(d.why === 'talking' ? 'Adam is talking…' : d.why === 'sent' ? 'Sent. Adam is thinking…' : 'Paused');
    else if (d.cmd === 'close') { pause(); window.close(); }
  });
  window.addEventListener('pagehide', () => tell('closed'));
  /* If the hub goes away, close this window too. */
  setInterval(() => { if (!opener || opener.closed) { stop(); window.close(); } }, 2000);

  pickMode().then(() => tell('ready'));
})();
</script>
</body>
</html>
